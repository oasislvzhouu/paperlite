<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' paperlite: data: blob:; connect-src 'self' paperlite: blob: data:; worker-src 'self' blob:; font-src 'self' data:"
    />
    <title>PaperLite</title>
  </head>
  <body>
    <div id="app">
      <div id="trans-status" hidden>
        <span class="spinner"></span>
        <span id="trans-status-text">AI 翻译中…</span>
      </div>
      <!-- 书架视图 -->
      <header id="shelf-header">
        <div class="brand">PaperLite <span class="brand-sub">文献书架</span></div>
        <input id="search" type="search" placeholder="搜索标题…" autocomplete="off" />
        <button id="import-btn" class="primary">导入 PDF</button>
      </header>
      <main id="shelf" class="grid"></main>
      <div id="empty-tip" hidden>
        <div class="empty-icon">📄</div>
        <p>书架还是空的，点右上角「导入 PDF」开始</p>
      </div>

      <!-- 阅读器视图 -->
      <section id="reader" hidden>
        <div id="reader-toolbar">
          <button id="back-btn" title="返回书架">← 书架</button>
          <button id="toc-btn" title="目录">☰ 目录</button>
          <div id="reader-title" class="ellipsis"></div>
          <span class="tb-sep"></span>
          <div class="modes">
            <button id="reflow-btn" class="toggle-on" title="排版模式（重排为流式文本）">排版</button>
            <button id="original-btn" title="原版模式（还原本来的版面）">原版</button>
          </div>
          <span class="tb-sep"></span>
          <div class="pager">
            <button id="prev-btn" title="上一页">‹ 上页</button>
            <span class="page-box">第 <input id="page-input" type="number" min="1" /> / <span id="page-total">?</span> 页</span>
            <button id="next-btn" title="下一页">下页 ›</button>
          </div>
          <span class="tb-sep"></span>
          <div class="fonter reflow-only">
            <button id="translate-btn" title="AI 翻译（GLM，双语对照）">译</button>
            <button id="search-btn" title="文内搜索">搜</button>
            <button id="width-btn" title="切换版面宽度">宽</button>
            <button id="font-dec" title="缩小字号">字−</button>
            <button id="font-inc" title="放大字号">字＋</button>
            <button id="notes-btn" title="笔记与高亮侧栏"><span>笔</span><i id="notes-count" class="badge">0</i></button>
            <button id="settings-btn" title="阅读设置（主题 / 字体 / 行高 / 译文样式）">Aa</button>
          </div>
          <div class="zoomer">
            <button id="zoom-out-btn" title="缩小">缩−</button>
            <button id="fit-btn" class="toggle-on" title="适应宽度">适宽</button>
            <button id="zoom-in-btn" title="放大">缩＋</button>
          </div>
        </div>
        <!-- 阅读设置面板 -->
        <div id="read-settings" hidden>
          <div class="rs-head">阅读设置</div>
          <div class="rs-row">
            <span class="rs-label">主题</span>
            <div class="rs-seg" id="rs-theme">
              <button data-v="dark">深色</button>
              <button data-v="light">浅色</button>
              <button data-v="sepia">护眼</button>
            </div>
          </div>
          <div class="rs-row">
            <span class="rs-label">字体</span>
            <select id="rs-font" class="rs-select">
              <option value="ebgaramond">EB Garamond（衬线）</option>
              <option value="libertine">Linux Libertine（衬线）</option>
              <option value="lato">Lato（无衬线）</option>
              <option value="opensans">Open Sans（无衬线）</option>
              <option value="serif">Georgia（系统）</option>
              <option value="cambria">Cambria（系统）</option>
              <option value="sans">系统无衬线</option>
              <option value="song">宋体</option>
            </select>
          </div>
          <div class="rs-row">
            <span class="rs-label">字号</span>
            <input id="rs-size" type="range" min="13" max="28" step="1" />
            <span class="rs-val" id="rs-size-val">17</span>
          </div>
          <div class="rs-row">
            <span class="rs-label">行高</span>
            <input id="rs-lh" type="range" min="1.3" max="2.2" step="0.05" />
            <span class="rs-val" id="rs-lh-val">1.75</span>
          </div>
          <div class="rs-row">
            <span class="rs-label">译文</span>
            <div class="rs-seg" id="rs-trans">
              <button data-v="underline">下划线</button>
              <button data-v="block">色块</button>
            </div>
          </div>
          <div class="rs-tip">设置自动保存，对所有文献生效</div>
        </div>
        <!-- 图片灯箱：图表 / 公式 / 表格点开放大 -->
        <div id="lightbox" hidden title="点击空白或按 Esc 关闭">
          <img id="lightbox-img" alt="" />
          <button id="lightbox-close" title="关闭">✕</button>
        </div>
        <!-- 笔记与高亮侧栏 -->
        <aside id="notes-panel" hidden>
          <div class="notes-head">
            <span>笔记与高亮</span>
            <button id="notes-close" title="收起侧栏">✕</button>
          </div>
          <div class="notes-tabs">
            <button data-tab="all" class="on">全部 <i id="cnt-all">0</i></button>
            <button data-tab="note">批注 <i id="cnt-note">0</i></button>
            <button data-tab="hl">高亮 <i id="cnt-hl">0</i></button>
          </div>
          <div class="notes-colors">
            <button data-color="all" class="on" title="全部颜色">全部</button>
            <button data-color="yellow" title="黄色"><span class="note-dot c-yellow"></span></button>
            <button data-color="green" title="绿色"><span class="note-dot c-green"></span></button>
            <button data-color="blue" title="蓝色"><span class="note-dot c-blue"></span></button>
          </div>
          <div id="notes-list"></div>
        </aside>
        <nav id="toc-panel" hidden>
          <div class="toc-head">目录</div>
          <div id="toc-list"></div>
        </nav>
        <div id="search-bar" hidden>
          <input id="search-input" type="search" placeholder="文内搜索…" autocomplete="off" />
          <span id="search-count" class="muted">0/0</span>
          <button id="search-prev" title="上一个">‹</button>
          <button id="search-next" title="下一个">›</button>
          <button id="search-close" title="关闭搜索">✕</button>
        </div>
        <div id="hl-pop" hidden>
          <button data-act="hl" title="划线高亮">🖍 高亮</button>
          <button data-act="note" title="高亮并写笔记">📝 笔记</button>
          <button data-act="copy" title="复制选中文本">⧉ 复制</button>
        </div>
        <div id="note-pop" hidden>
          <textarea id="note-text" placeholder="写下你的笔记…" rows="3"></textarea>
          <div class="note-colors">
            <button class="swatch c-yellow" data-color="yellow" title="黄色"></button>
            <button class="swatch c-green" data-color="green" title="绿色"></button>
            <button class="swatch c-blue" data-color="blue" title="蓝色"></button>
            <button class="swatch c-pink" data-color="pink" title="粉色"></button>
          </div>
          <div class="note-actions">
            <button id="note-delete" class="danger" title="删除此高亮">删除</button>
            <button id="note-save" class="primary">保存</button>
          </div>
        </div>
        <div id="page-wrap"><div id="pdf-scroll"></div></div>
        <div id="reflow-wrap" hidden>
          <div id="reflow-loading" hidden>正在解析排版…</div>
          <article id="reflow-article"></article>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
