<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' paperlite: data: blob:; connect-src 'self' paperlite: blob: data:; worker-src 'self' blob:; font-src 'self' data:"
    />
    <title>PaperLite</title>
  </head>
  <body>
    <div id="app">
      <div id="trans-status" hidden>
        <span class="spinner"></span>
        <span id="trans-status-text">AI 翻译中…</span>
      </div>
      <!-- 书架视图 -->
      <header id="shelf-header">
        <div class="brand">PaperLite <span class="brand-sub">文献书架</span></div>
        <input id="search" type="search" placeholder="搜索标题…" autocomplete="off" />
        <button id="import-btn" class="primary">导入 PDF</button>
      </header>
      <main id="shelf" class="grid"></main>
      <div id="empty-tip" hidden>
        <div class="empty-icon">📄</div>
        <p>书架还是空的，点右上角「导入 PDF」开始</p>
      </div>

      <!-- 阅读器视图 -->
      <section id="reader" hidden>
        <div id="reader-toolbar">
          <button id="back-btn" title="返回书架">← 书架</button>
          <button id="toc-btn" title="目录">☰ 目录</button>
          <div id="reader-title" class="ellipsis"></div>
          <span class="tb-sep"></span>
          <div class="modes">
            <button id="reflow-btn" class="toggle-on" title="排版模式（重排为流式文本）">排版</button>
            <button id="original-btn" title="原版模式（还原本来的版面）">原版</button>
          </div>
          <span class="tb-sep"></span>
          <div class="pager">
            <button id="prev-btn" title="上一页">‹ 上页</button>
            <span class="page-box">第 <input id="page-input" type="number" min="1" /> / <span id="page-total">?</span> 页</span>
            <button id="next-btn" title="下一页">下页 ›</button>
          </div>
          <span class="tb-sep"></span>
          <div class="fonter reflow-only">
            <button id="translate-btn" title="AI 翻译（GLM，双语对照）">译</button>
            <button id="search-btn" title="文内搜索">搜</button>
            <button id="width-btn" title="切换版面宽度">宽</button>
            <button id="font-dec" title="缩小字号">字−</button>
            <button id="font-inc" title="放大字号">字＋</button>
          </div>
          <div class="zoomer">
            <button id="zoom-out-btn" title="缩小">缩−</button>
            <button id="fit-btn" class="toggle-on" title="适应宽度">适宽</button>
            <button id="zoom-in-btn" title="放大">缩＋</button>
          </div>
        </div>
        <nav id="toc-panel" hidden>
          <div class="toc-head">目录</div>
          <div id="toc-list"></div>
        </nav>
        <div id="search-bar" hidden>
          <input id="search-input" type="search" placeholder="文内搜索…" autocomplete="off" />
          <span id="search-count" class="muted">0/0</span>
          <button id="search-prev" title="上一个">‹</button>
          <button id="search-next" title="下一个">›</button>
          <button id="search-close" title="关闭搜索">✕</button>
        </div>
        <div id="hl-pop" hidden>
          <button data-act="hl" title="划线高亮">🖍 高亮</button>
          <button data-act="note" title="高亮并写笔记">📝 笔记</button>
          <button data-act="copy" title="复制选中文本">⧉ 复制</button>
        </div>
        <div id="note-pop" hidden>
          <textarea id="note-text" placeholder="写下你的笔记…" rows="3"></textarea>
          <div class="note-colors">
            <button class="swatch c-yellow" data-color="yellow" title="黄色"></button>
            <button class="swatch c-green" data-color="green" title="绿色"></button>
            <button class="swatch c-blue" data-color="blue" title="蓝色"></button>
            <button class="swatch c-pink" data-color="pink" title="粉色"></button>
          </div>
          <div class="note-actions">
            <button id="note-delete" class="danger" title="删除此高亮">删除</button>
            <button id="note-save" class="primary">保存</button>
          </div>
        </div>
        <div id="page-wrap"><div id="pdf-scroll"></div></div>
        <div id="reflow-wrap" hidden>
          <div id="reflow-loading" hidden>正在解析排版…</div>
          <article id="reflow-article"></article>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
